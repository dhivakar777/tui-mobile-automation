# Android execution settings.
# Any key can be overridden with -Dkey=value or an environment variable
# named in UPPER_SNAKE_CASE (e.g. app.path -> APP_PATH, device.udid -> DEVICE_UDID).

appium.server.url=http://127.0.0.1:4723

# Leave blank to use the only connected device/emulator; set when several are attached.
device.udid=
device.name=Android Device

# Leave blank to launch the already-installed app; set to an APK path to (re)install it.
app.path=
app.package=com.tui.qa.challenge
app.activity=com.tui.qa.challenge.MainActivity

# false = clear app data at session start so every scenario begins on a fresh login screen.
app.no.reset=false

timeout.new.command.seconds=120
timeout.explicit.wait.seconds=15
