# Execution settings. Override any key per run with -Dkey=value, e.g. mvn test -Ddevice.udid=emulator-5554

appium.server.url=http://127.0.0.1:4723

# Where sessions run: local (default) or cloud. Any other value is rejected; cloud never falls back to local.
execution.target=local

# Optional: leave blank to use the only connected device/emulator.
device.udid=

# Optional, for parallel runs: comma-separated devices to share between concurrent scenarios, each given its own
# UiAutomator2 port. Use instead of device.udid, with -Dparallel.threads no larger than the number of devices.
# Example: mvn clean test -Ddevice.udids=emulator-5554,<phone-udid> -Dparallel.threads=2
device.udids=

# Optional: leave blank to launch the installed app; set to an APK path to install it first.
app.path=
app.package=com.tui.qa.challenge
app.activity=com.tui.qa.challenge.MainActivity

# Device language and region for the test session. The app formats dates and prices from the device locale,
# and the test data expects en-GB (dd/MM/yyyy dates, GBP prices). Appium changes the device locale at session start
# and does not restore it afterwards. Leave both blank to keep the device's own locale.
device.language=en
device.locale=GB

timeout.explicit.wait.seconds=15

# Extra attempts for a scenario that fails with an environmental error (see retry/RetryAnalyzer). 0 disables retry.
retry.max.retries=1

# Cloud execution (used only when execution.target=cloud). BrowserStack only.
# Credentials are read from the BROWSERSTACK_USERNAME and BROWSERSTACK_ACCESS_KEY environment variables only.
# Never put them in this file, in the hub URL or in -D properties. device.udid, device.udids and app.path must
# be blank in cloud mode; cloud.app is the app id returned by BrowserStack's app upload (bs://...).
cloud.provider=browserstack
cloud.hub.url=https://hub-cloud.browserstack.com/wd/hub
cloud.app=
cloud.device.name=
cloud.platform.version=
cloud.project.name=TUI mobile automation
cloud.build.name=local
